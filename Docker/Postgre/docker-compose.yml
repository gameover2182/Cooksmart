services:

  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    container_name: cooksmart
    environment:
      # Credenciales desde .env (NO versionado). Compose aborta si faltan.
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}

    volumes:
      - cooksmart_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: cooksmart-api
    restart: always
    environment:
      # Credenciales y secreto desde .env (control C1/M7: ya no están en el repo).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env (rotado; fuera del repo)}
      # Observabilidad (M7): sin token, /metrics no existe (404).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Log por peticion (on por defecto); off reduce volumen sin perder metricas.
      LOG_PETICIONES: ${LOG_PETICIONES:-on}
      # Seguridad (M7): límite de intentos fallidos de login (C2), activo por defecto.
      LOGIN_RATELIMIT: ${LOGIN_RATELIMIT:-on}
      # Tácticas de resiliencia de EXP-003 (apagadas por defecto)
      LOGIN_BULKHEAD: ${LOGIN_BULKHEAD:-off}
      CACHE_CATALOGO: ${CACHE_CATALOGO:-off}
      CACHE_MAX_ENTRADAS: ${CACHE_MAX_ENTRADAS:-500}
      # EXP-004: procesos de la API en el mismo host (1 = comportamiento original)
      API_WORKERS: ${API_WORKERS:-1}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: always
    ports:
      # Control C5 (M7, amenaza A6): consola de base de datos SOLO accesible
      # desde la propia máquina, nunca expuesta a la red.
      - "127.0.0.1:5433:8080"

volumes:
  cooksmart_pgdata:
