name: Fitness functions CookSmart

# Funciones de aptitud arquitectónica (Módulo 6). Ver docs/m6/fitness-functions.md.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  reglas-de-capas:
    name: FF-1 Reglas de dependencia entre capas (ADR-002)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar que ninguna capa importe una capa no permitida
        # Umbral: 0 violaciones. Cualquier violación termina con exit 1 y rompe el PR.
        run: node fitness/reglas-capas.js Docker/Postgre/backend/src

      - name: Autoprueba de la regla (debe detectar una violación inyectada)
        # Evita que la fitness function "pase siempre" por un error en el propio script.
        run: |
          cp -r Docker/Postgre/backend/src /tmp/src-con-violacion
          echo "const pg = require('pg');" >> /tmp/src-con-violacion/controllers/recetas.controller.js
          if node fitness/reglas-capas.js /tmp/src-con-violacion; then
            echo "La fitness function no detectó la violación inyectada"
            exit 1
          fi
          echo "Autoprueba OK: la violación inyectada fue detectada"

  resiliencia-bulkhead:
    name: FF-3 El bulkhead de login protege y no fuga cupos (EXP-003)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Docker/Postgre/backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: Docker/Postgre/backend
        run: npm ci

      - name: Pruebas del bulkhead
        # Umbral: 3/3 pruebas. Falla si un cliente desconectado deja el cupo ocupado
        # (el defecto encontrado en EXP-003) o si el bulkhead deja de rechazar bajo saturación.
        working-directory: Docker/Postgre/backend
        run: node --test --test-timeout=20000 test/bulkheadLogin.test.js

  controles-seguridad:
    name: FF-6 Controles de seguridad y observabilidad (EXP-005 / M7)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Docker/Postgre/backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: Docker/Postgre/backend
        run: npm ci

      - name: Pruebas de cabeceras, caché acotada, límite de login y /metrics
        # Umbral: 5/5. Falla si se cae una cabecera, si la caché deja de tener tope,
        # si el límite de intentos deja de bloquear, o si /metrics queda sin protección.
        working-directory: Docker/Postgre/backend
        run: node --test --test-timeout=20000 test/seguridadObservabilidad.test.js
