name: Load Test CookSmart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  k6-load-test:
    name: Prueba de carga con k6
    runs-on: ubuntu-latest

    # Mismo Postgres real que usa el job api-postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: Cooksmart2024
          POSTGRES_DB: cooksmart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d cooksmart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Docker/Postgre/backend/package-lock.json

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Cargar schema
        run: PGPASSWORD=Cooksmart2024 psql -h localhost -U admin -d cooksmart -f Docker/Postgre/init/01_schema.sql

      - name: Cargar datos semilla
        run: PGPASSWORD=Cooksmart2024 psql -h localhost -U admin -d cooksmart -f Docker/Postgre/init/02_seed.sql

      - name: Instalar dependencias del backend
        working-directory: Docker/Postgre/backend
        run: npm ci

      - name: Levantar la API en segundo plano
        working-directory: Docker/Postgre/backend
        env:
          DATABASE_URL: postgresql://admin:Cooksmart2024@localhost:5432/cooksmart
          PORT: 3000
          JWT_SECRET: ci-test-secret
        run: nohup node src/server.js > server.log 2>&1 &

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "API lista"
              exit 0
            fi
            sleep 2
          done
          cat Docker/Postgre/backend/server.log
          exit 1

      - name: Instalar k6
        # Se instala el binario directo en el runner, en vez de la action Docker,
        # para que k6 comparta el mismo "localhost" donde ya escucha la API
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6ACFD8
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Correr k6 contra /api/recetas
        # diagnostico.js no necesita login, por eso se usa en CI en vez de load-test.js
        run: k6 run k6-demo/diagnostico.js

      - name: Mostrar logs de la API si algo falla
        if: failure()
        run: cat Docker/Postgre/backend/server.log || true